name: Deploy Scout to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - worker.js
      - wrangler.jsonc
      - package.json
      - package-lock.json
      - .github/workflows/deploy-scout.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-scout-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and verify Scout
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: otb-role-intelligence
      HEALTH_URL: https://otb-role-intelligence.blackpharoahisking.workers.dev/api/health

    steps:
      - name: Check out Scout main
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Confirm Cloudflare credentials are configured
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Deploy current Scout main
        shell: bash
        run: >-
          npx --yes wrangler@4.120.1 deploy
          --name "$WORKER_NAME"
          --message "GitHub ${GITHUB_SHA}"

      - name: Verify live Scout build
        shell: bash
        run: |
          for attempt in {1..12}; do
            if health_json="$(curl --fail --silent --show-error "$HEALTH_URL")"; then
              if HEALTH_JSON="$health_json" node -e '
                const health = JSON.parse(process.env.HEALTH_JSON);
                const valid = health.status === "ok"
                  && health.workerBuild === "v2.22.4-rc5.2.4-club-discovery"
                  && health.schemaVersion === "1.33.0"
                  && health.structuredFeedAvailable === true
                  && !("apiFootballAvailable" in health);
                if (!valid) process.exit(1);
                console.log(`Verified ${health.workerBuild}, schema ${health.schemaVersion}`);
              '; then
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Scout health did not report the expected build after deployment." >&2
          exit 1

      - name: Remove obsolete API-Football secret
        shell: bash
        run: |
          secret_json="$(npx --yes wrangler@4.120.1 secret list --name "$WORKER_NAME" --format json)"
          if SECRET_JSON="$secret_json" node -e '
            const secrets = JSON.parse(process.env.SECRET_JSON);
            process.exit(secrets.some((secret) => secret.name === "API_FOOTBALL_KEY") ? 0 : 1);
          '; then
            printf 'y\n' | npx --yes wrangler@4.120.1 secret delete API_FOOTBALL_KEY --name "$WORKER_NAME"
          else
            echo "API_FOOTBALL_KEY is already absent."
          fi

      - name: Confirm secret removal and Worker health
        shell: bash
        run: |
          secret_json="$(npx --yes wrangler@4.120.1 secret list --name "$WORKER_NAME" --format json)"
          SECRET_JSON="$secret_json" node -e '
            const secrets = JSON.parse(process.env.SECRET_JSON);
            if (secrets.some((secret) => secret.name === "API_FOOTBALL_KEY")) {
              throw new Error("API_FOOTBALL_KEY still exists");
            }
            console.log("Confirmed API_FOOTBALL_KEY is absent.");
          '
          health_json="$(curl --fail --silent --show-error "$HEALTH_URL")"
          HEALTH_JSON="$health_json" node -e '
            const health = JSON.parse(process.env.HEALTH_JSON);
            if (health.status !== "ok" || health.workerBuild !== "v2.22.4-rc5.2.4-club-discovery") {
              throw new Error("Scout health check failed after secret removal");
            }
            console.log("Scout remains healthy after secret cleanup.");
          '
