name: Deploy Scout to Cloudflare
# RC5.5.0 durable Fresh Review Workflow and exact-build health gate.

on:
  push:
    branches: [main]
    paths:
      - worker.js
      - role-freshness-entry.js
      - integrity-entry.js
      - src/role-freshness-core.js
      - src/fresh-review-integrity.js
      - wrangler.jsonc
      - package.json
      - package-lock.json
      - .github/workflows/deploy-scout.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-scout-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and verify Scout
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: otb-role-intelligence
      HEALTH_URL: https://otb-role-intelligence.blackpharoahisking.workers.dev/api/health

    steps:
      - name: Check out Scout main
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Confirm Cloudflare credentials are configured
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Run Worker regression tests
        shell: bash
        run: |
          node --check worker.js
          node --check role-freshness-entry.js
          node --check integrity-entry.js
          node --check src/role-freshness-core.js
          node --check src/fresh-review-integrity.js
          node --test test/*.test.mjs

      - name: Deploy current Scout main
        shell: bash
        run: >-
          npx --yes wrangler@4.120.1 deploy
          --name "$WORKER_NAME"
          --message "GitHub ${GITHUB_SHA}"

      - name: Verify live Scout build
        shell: bash
        run: |
          EXPECTED_BUILD="$(sed -n "s/^const WORKER_BUILD = '\([^']*\)';/\1/p" worker.js)"
          EXPECTED_SCHEMA="$(sed -n "s/^const SCHEMA_VERSION = '\([^']*\)';/\1/p" worker.js)"
          EXPECTED_INTEGRITY="fresh-review-decision-integrity-v1"
          test -n "$EXPECTED_BUILD"
          test -n "$EXPECTED_SCHEMA"
          export EXPECTED_BUILD EXPECTED_SCHEMA EXPECTED_INTEGRITY
          for attempt in {1..12}; do
            if health_json="$(curl --fail --silent --show-error "$HEALTH_URL")"; then
              if HEALTH_JSON="$health_json" node -e '
                const health = JSON.parse(process.env.HEALTH_JSON);
                const valid = health.status === "ok"
                  && health.workerBuild === process.env.EXPECTED_BUILD
                  && health.schemaVersion === process.env.EXPECTED_SCHEMA
                  && health.structuredFeedAvailable === true
                  && health.freshReviewAvailable === true
                  && health.freshReviewVersion === "1.2.0"
                  && health.freshReviewDecisionIntegrity === process.env.EXPECTED_INTEGRITY
                  && health.freshReviewAuthConfigured === true
                  && health.freshReviewAuthMode === "key-only"
                  && health.freshReviewAccessConfigured === false
                  && health.freshReviewWorkflowConfigured === true
                  && health.freshReviewBackgroundMode === "cloudflare-workflow"
                  && !("apiFootballAvailable" in health);
                if (!valid) process.exit(1);
                console.log(`Verified ${health.workerBuild}, schema ${health.schemaVersion}, ${health.freshReviewDecisionIntegrity}`);
              '; then
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Scout health did not report the expected build/integrity layer after deployment." >&2
          exit 1

      - name: Confirm live Fresh Review endpoint is owner-protected
        shell: bash
        run: |
          # Workers deploy globally; a request immediately after the health
          # probe can briefly land on an older isolate. Retry the negative auth
          # assertion so propagation does not turn a healthy release red.
          for attempt in $(seq 1 8); do
            status="$(curl --silent --output /tmp/fresh-review.json --write-out '%{http_code}' \
              -X POST "https://otb-role-intelligence.blackpharoahisking.workers.dev/api/fresh-review" \
              -H 'Content-Type: application/json' --data '{}')"
            if [ "$status" = "401" ]; then
              exit 0
            fi
            sleep 3
          done
          echo "Fresh Review endpoint did not settle on owner-protected 401; last status: $status" >&2
          exit 1
