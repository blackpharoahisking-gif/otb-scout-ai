name: Temp Fresh Review integrity audit
on:
  push:
    branches: [codex/fresh-review-classifier-integrity]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Syntax
        run: |
          node --check worker.js
          node --check role-freshness-entry.js
          node --check integrity-entry.js
          node --check src/fresh-review-integrity.js
      - name: Fresh Review integrity
        run: node --test test/fresh-review-integrity.test.mjs test/fresh-review.test.mjs
      - name: Full Scout suite
        run: npm test
