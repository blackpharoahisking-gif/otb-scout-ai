name: Temp role freshness audit
on:
  push:
    branches: [codex/role-freshness-integrity]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Syntax
        run: |
          node --check role-freshness-entry.js
          node --check src/role-freshness-core.js
      - name: Focused role freshness tests
        run: node --test test/role-freshness.test.mjs
      - name: Existing scout suite
        run: npm test
